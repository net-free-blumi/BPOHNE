<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>B-Phone ביפון תקשורת סלולרית - בית שמש - ביתר</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./logos/logo-bphone.png">
    <meta property="og:title" content="B-Phone תקשורת סלולרית">
    <meta property="og:image" content="logos/logo-bphone.png">

    <!-- פונט עברי מודרני: Heebo (כותרות) + Rubik (גוף) -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Design System + נגישות -->
    <style>
      /* ─── Design Tokens ─── */
      :root {
        --c-primary:      #1e3a5f;
        --c-primary-dark: #152d4a;
        --c-accent:       #f97316;
        --c-accent-hover: #ea6a0a;
        --c-text:         #0f172a;
        --c-muted:        #64748b;
        --c-surface:      #ffffff;
        --c-alt:          #fafafa;
        --c-border:       #e5e7eb;
        --c-success:      #10b981;
        --radius-card:    10px;
        --shadow-card:    0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
        --shadow-hover:   0 4px 12px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.05);
      }

      /* ─── Base ─── */
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: 'Heebo', 'Rubik', system-ui, sans-serif; background: var(--c-alt); color: var(--c-text); -webkit-font-smoothing: antialiased; }

      /* ─── Cards ─── */
      .bp-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); transition: box-shadow .2s ease, transform .2s ease; }
      .bp-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

      /* ─── Buttons ─── */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-weight: 600; border-radius: .75rem; padding: .75rem 1.5rem; transition: background .15s, transform .1s, box-shadow .15s; cursor: pointer; border: none; font-family: inherit; font-size: .9375rem; line-height: 1; }
      .btn:active { transform: scale(.97); }
      .btn-primary   { background: var(--c-accent); color: #fff; }
      .btn-primary:hover { background: var(--c-accent-hover); }
      .btn-navy      { background: var(--c-primary); color: #fff; }
      .btn-navy:hover { background: var(--c-primary-dark); }
      .btn-ghost     { background: transparent; color: var(--c-primary); border: 1.5px solid var(--c-border); }
      .btn-ghost:hover { border-color: var(--c-primary); background: #f1f5f9; }
      .btn-whatsapp  { background: #16a34a; color: #fff; }
      .btn-whatsapp:hover { background: #15803d; }
      .btn-sm        { padding: .5rem 1rem; font-size: .875rem; }

      /* ─── Section headers ─── */
      .section-label { display: inline-block; background: #fff7ed; color: var(--c-accent); font-size: .8125rem; font-weight: 700; padding: .25rem .875rem; border-radius: 9999px; border: 1px solid #fed7aa; margin-bottom: .75rem; }
      .section-title { font-size: 1.875rem; font-weight: 700; color: var(--c-primary); line-height: 1.25; }
      .section-sub   { color: var(--c-muted); font-size: 1rem; margin-top: .5rem; }

      /* ─── Package card accent stripe ─── */
      .pkg-stripe { position: relative; overflow: hidden; }
      .pkg-stripe::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 60%); pointer-events: none; }

      /* ─── Divider ─── */
      .trust-divider { width: 1px; height: 40px; background: var(--c-border); }

      /* ─── Animations ─── */
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .fade-up { animation: fadeUp .5s ease both; }

      /* ─── Accessibility ─── */
      html.acc-font-large  { font-size: 118%; }
      html.acc-font-x-large { font-size: 135%; }
      html.acc-contrast-high body,
      html.acc-contrast-high .bg-slate-50 { background: #1e293b !important; }
      html.acc-contrast-high .text-slate-900,
      html.acc-contrast-high .text-gray-600,
      html.acc-contrast-high .text-gray-700 { color: #e2e8f0 !important; }
      html.acc-contrast-high .bg-white { background: #334155 !important; border-color: #475569 !important; }
      html.acc-links-highlight a { outline: 2px solid #3b82f6; outline-offset: 2px; background: rgba(59,130,246,.15); border-radius: 2px; }

      /* ─── Scrollbar (subtle) ─── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--c-alt); }
      ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
    </style>

    <!-- Tailwind via CDN (מתאים לדמו ולפתיחה ישירות מהקובץ) -->
