<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>ניהול B-Phone | פאנל מנהלים</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./logos/logo-bphone.png">
    <meta name="robots" content="noindex, nofollow">

    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>

    <style>
      * { font-family: 'Rubik', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script>
      window.IMGBB_API_KEY = "d812973a77f1d757a2b824ce7f5a1aeb";
      // אותו Worker של ביביפ בוט – המלצת AI במוצרים משתמשת באותו API
      window.GEMINI_PROXY_URL = "https://gemini-proxy.123123mushh.workers.dev";
      // גיבוי אופציונלי (מומלץ): Worker נוסף עם מפתח Gemini אחר לחשבון/פרויקט נפרד
      // window.GEMINI_PROXY_URL_BACKUP = "https://gemini-proxy-backup.YOUR-ACCOUNT.workers.dev";
    </script>
    <script>
      (function () {
        var JSX_URL = "./admin.jsx?v=2";
        function showError(msg) {
          var root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div style="padding:2rem;font-family:sans-serif;max-width:36rem;margin:auto;text-align:center">' +
              '<p style="color:#b91c1c;font-weight:700;margin-bottom:.5rem">שגיאה בטעינת פאנל הניהול</p>' +
              "<p style=\"color:#475569\">" + msg + "</p></div>";
          }
          console.error(msg);
        }
        fetch(JSX_URL)
          .then(function (res) {
            if (!res.ok) throw new Error("לא ניתן לטעון " + JSX_URL + " (HTTP " + res.status + ")");
            return res.text();
          })
          .then(function (src) {
            if (/^\s*</.test(src)) {
              throw new Error(
                "admin.jsx החזיר HTML במקום קוד JSX. השתמש ב-Live Server (בלי מצב SPA) – לא בשרת שמפנה כל קובץ ל-index.html."
              );
            }
            if (typeof Babel === "undefined") throw new Error("Babel לא נטען");
            var out = Babel.transform(src, { presets: ["react"], sourceType: "script" }).code;
            var el = document.createElement("script");
            el.text = out;
            document.body.appendChild(el);
          })
          .catch(function (err) {
            showError(err.message || String(err));
          });
      })();
    </script>
  </body>
</html>
