# דף ניהול נפרד
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# דף הניהול – גישה ב־/admin או /admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA – רק נתיבים שלא מתאימים לקובץ סטטי קיים (force=false כברירת מחדל)
# app.jsx / admin.jsx / firebase-config.js וכו' נשארים נגישים ל-Babel
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Edge Function לנתיבי /product/:id – OG tags למוצרים
[[edge_functions]]
  function = "product-og"
  path = "/product/*"
